<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%" className="w-full h-full">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="60%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#03060a" />
    </radialGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="pinkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  {/* Background */}
  <rect width="900" height="600" fill="url(#bgGrad)" />

  {/* Ambient network web lines */}
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.75">
    <line x1="450" y1="300" x2="280" y2="190" />
    <line x1="450" y1="300" x2="620" y2="210" />
    <line x1="450" y1="300" x2="330" y2="420" />
    <line x1="450" y1="300" x2="570" y2="410" />
    <line x1="450" y1="300" x2="190" y2="310" />
    <line x1="450" y1="300" x2="710" y2="290" />
    
    <line x1="280" y1="190" x2="190" y2="130" />
    <line x1="280" y1="190" x2="350" y2="110" />
    <line x1="280" y1="190" x2="160" y2="220" />
    <line x1="280" y1="190" x2="330" y2="420" stroke="url(#cyanPurple)" stroke-opacity="0.25" />

    <line x1="620" y1="210" x2="740" y2="160" />
    <line x1="620" y1="210" x2="560" y2="120" />
    <line x1="620" y1="210" x2="710" y2="290" stroke="url(#pinkGold)" stroke-opacity="0.3" />
    <line x1="620" y1="210" x2="570" y2="410" />

    <line x1="330" y1="420" x2="240" y2="490" />
    <line x1="330" y1="420" x2="420" y2="510" />
    <line x1="570" y1="410" x2="660" y2="480" />
    <line x1="570" y1="410" x2="490" y2="520" />
  </g>

  {/* Intricate dense cluster strands */}
  <g stroke="url(#cyanPurple)" stroke-opacity="0.35" stroke-width="0.8">
    <path d="M 280 190 Q 220 230 190 310 T 330 420" fill="none" />
    <path d="M 620 210 Q 690 330 570 410 T 450 300" fill="none" />
    <path d="M 190 130 Q 300 80 450 150 T 620 210" fill="none" stroke="url(#pinkGold)" stroke-opacity="0.25" />
    <path d="M 240 490 Q 450 560 660 480" fill="none" />
  </g>

  {/* Scatter node particles */}
  <g fill="#00f5d4" opacity="0.6">
    <circle cx="160" cy="140" r="2.5" />
    <circle cx="210" cy="110" r="1.5" />
    <circle cx="240" cy="160" r="2" />
    <circle cx="140" cy="220" r="3" />
    <circle cx="170" cy="270" r="2" />
    <circle cx="220" cy="260" r="1.5" />
    <circle cx="310" cy="130" r="2.5" />
    <circle cx="370" cy="140" r="2" />
    <circle cx="250" cy="380" r="3" />
    <circle cx="210" cy="440" r="2" />
    <circle cx="290" cy="480" r="2.5" />
    <circle cx="380" cy="460" r="1.5" />
  </g>

  <g fill="#ff007f" opacity="0.65">
    <circle cx="680" cy="150" r="2" />
    <circle cx="750" cy="190" r="3" />
    <circle cx="780" cy="260" r="2" />
    <circle cx="720" cy="240" r="1.5" />
    <circle cx="660" cy="270" r="2.5" />
    <circle cx="760" cy="330" r="2" />
    <circle cx="690" cy="370" r="3" />
    <circle cx="620" cy="460" r="2" />
    <circle cx="530" cy="480" r="2.5" />
    <circle cx="600" cy="510" r="1.5" />
    <circle cx="490" cy="220" r="2" />
    <circle cx="410" cy="240" r="2" />
  </g>

  <g fill="#ffb703" opacity="0.6">
    <circle cx="430" cy="160" r="2.5" />
    <circle cx="470" cy="170" r="2" />
    <circle cx="520" cy="200" r="1.5" />
    <circle cx="380" cy="350" r="2" />
    <circle cx="430" cy="390" r="2.5" />
    <circle cx="470" cy="420" r="3" />
  </g>

  {/* Main Key Opinion Leader Hubs (Nodes from actual Indat research) */}
  
  {/* Center Hub: #Ayotzinapa Core */}
  <g transform="translate(450, 300)">
    <circle r="28" fill="#7b2cbf" opacity="0.25" filter="url(#glow)" />
    <circle r="18" fill="#7b2cbf" stroke="#ffffff" stroke-width="2" />
    <text y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.05em">#Ayotzinapa</text>
    <text y="44" text-anchor="middle" fill="#9d4edd" font-family="system-ui, sans-serif" font-size="9" font-weight="600">842K menciones</text>
  </g>

  {/* Node: aristeguionline */}
  <g transform="translate(280, 190)">
    <circle r="22" fill="#00f5d4" opacity="0.3" filter="url(#glow)" />
    <circle r="14" fill="#00b4d8" stroke="#ffffff" stroke-width="2" />
    <text y="-20" text-anchor="middle" fill="#00f5d4" font-family="system-ui, sans-serif" font-size="11" font-weight="700">@aristeguionline</text>
    <text y="-9" text-anchor="middle" fill="#ffffff" opacity="0.7" font-family="system-ui, sans-serif" font-size="8">Hub Informativo</text>
  </g>

  {/* Node: lajornadaonline */}
  <g transform="translate(620, 210)">
    <circle r="24" fill="#ff007f" opacity="0.3" filter="url(#glow)" />
    <circle r="15" fill="#e63946" stroke="#ffffff" stroke-width="2" />
    <text y="-20" text-anchor="middle" fill="#ff758f" font-family="system-ui, sans-serif" font-size="11" font-weight="700">@lajornadaonline</text>
    <text y="-9" text-anchor="middle" fill="#ffffff" opacity="0.7" font-family="system-ui, sans-serif" font-size="8">Prensa Nacional</text>
  </g>

  {/* Node: el_universal_mx */}
  <g transform="translate(190, 310)">
    <circle r="18" fill="#ffb703" opacity="0.25" />
    <circle r="11" fill="#fb8500" stroke="#ffffff" stroke-width="1.5" />
    <text x="-16" y="4" text-anchor="end" fill="#ffb703" font-family="system-ui, sans-serif" font-size="10" font-weight="700">@el_universal_mx</text>
  </g>

  {/* Node: johnackerman */}
  <g transform="translate(710, 290)">
    <circle r="18" fill="#7209b7" opacity="0.3" />
    <circle r="11" fill="#560bad" stroke="#ffffff" stroke-width="1.5" />
    <text x="16" y="4" text-anchor="start" fill="#b5179e" font-family="system-ui, sans-serif" font-size="10" font-weight="700">@JohnMAckerman</text>
  </g>

  {/* Node: chnmex */}
  <g transform="translate(330, 420)">
    <circle r="16" fill="#4cc9f0" opacity="0.25" />
    <circle r="10" fill="#4895ef" stroke="#ffffff" stroke-width="1.5" />
    <text y="24" text-anchor="middle" fill="#4cc9f0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">@chnmex</text>
  </g>

  {/* Node: epn / presidencia cluster */}
  <g transform="translate(570, 410)">
    <circle r="17" fill="#f72585" opacity="0.25" />
    <circle r="10" fill="#b5179e" stroke="#ffffff" stroke-width="1.5" />
    <text y="24" text-anchor="middle" fill="#f72585" font-family="system-ui, sans-serif" font-size="10" font-weight="700">@PresidenciaMX</text>
  </g>

  {/* Watermark/Metadata overlay from original Indat publication */}
  <g transform="translate(24, 560)">
    <rect width="280" height="24" fill="#000000" fill-opacity="0.6" rx="3" />
    <text x="10" y="16" fill="#ffffff" opacity="0.8" font-family="system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.1em">INDAT RESEARCH · SOCIAL LISTENING NETWORK</text>
  </g>
</svg>
